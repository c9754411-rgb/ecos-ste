<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ECOS STE"><meta name="theme-color" content="#0d6b62">
<title>ECOS Médecine du travail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6; --surface:#fffdf8; --surface2:#f8f4ea; --ink:#15221e; --muted:#58675f; --line:#ddd5c4;
  --accent:#0d6b62; --accent2:#e0f0ec; --accent-ink:#ffffff; --warn:#b4530b; --warnbg:#fdf0e1;
  --bad:#b42323; --badbg:#fbe9e7; --good:#17773c; --goodbg:#e5f4ea; --shadow:0 2px 0 rgba(21,34,30,.06),0 8px 24px rgba(21,34,30,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1614; --surface:#16211e; --surface2:#1b2825; --ink:#eaf1ee; --muted:#9db0a8; --line:#2b3b36;
  --accent:#3cc9b4; --accent2:#173a34; --accent-ink:#04201c; --warn:#f59e4b; --warnbg:#3a2612;
  --bad:#f07272; --badbg:#3a1a1a; --good:#5bd68a; --goodbg:#143322; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#16211e; --surface2:#1b2825; --ink:#eaf1ee; --muted:#9db0a8; --line:#2b3b36;
  --accent:#3cc9b4; --accent2:#173a34; --accent-ink:#04201c; --warn:#f59e4b; --warnbg:#3a2612;
  --bad:#f07272; --badbg:#3a1a1a; --good:#5bd68a; --goodbg:#143322; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html{font-size:clamp(18px, 0.9vw + 14px, 25px); -webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.45;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));min-height:100dvh;display:flex;flex-direction:column}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.02;font-weight:800}
h2{font-size:1.6rem;line-height:1.1}
h3{font-size:1.2rem}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:16px}
.brand{font-family:Fraunces,serif;font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:.75em 1.1em;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:3.2rem;box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{min-height:2.5rem;padding:.4em .85em;font-size:.85rem;border-radius:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:14px}
.grow{flex:1}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.hero{display:grid;gap:18px;grid-template-columns:1fr;flex:1;align-content:center}
.hero .lead{font-size:1.15rem;max-width:40ch}
.big-choices{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.choice{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:6px;min-height:9rem;box-shadow:var(--shadow)}
.choice b{font-family:Fraunces,serif;font-size:1.35rem}
.choice span{color:var(--muted);font-size:.95rem}
.choice.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice.pri span{color:inherit;opacity:.85}
.choice[disabled]{opacity:.5}
.ico{font-size:1.7rem;line-height:1}
.note{border-radius:18px;padding:14px 16px;background:var(--warnbg);color:var(--ink);border:2px solid transparent;font-size:.95rem}
.note.info{background:var(--accent2)}
.code{font-family:Fraunces,serif;font-weight:800;font-size:clamp(3.5rem,16vw,7rem);letter-spacing:.12em;line-height:1;text-align:center;color:var(--accent)}
input.codein{font:inherit;font-family:Fraunces,serif;font-weight:800;font-size:clamp(2.6rem,12vw,4.5rem);letter-spacing:.2em;text-transform:uppercase;text-align:center;width:100%;max-width:9ch;padding:.15em .2em;border-radius:20px;border:3px solid var(--line);background:var(--surface);color:var(--ink)}
input.codein:focus{outline:none;border-color:var(--accent)}
.stgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stc{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-height:7.2rem;box-shadow:var(--shadow)}
.stc .n{font-family:Fraunces,serif;font-weight:800;font-size:1.9rem;color:var(--accent);line-height:1}
.stc .t{font-weight:700;font-size:1rem;line-height:1.2}
.stc .m{font-size:.8rem;color:var(--muted);margin-top:auto}
.stc.sel{border-color:var(--accent);outline:3px solid var(--accent);outline-offset:-1px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:.15em .6em;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:.55em 1em;font-weight:700;min-height:2.8rem}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
/* timer bar */
.tbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;margin:-6px 0 10px}
.tin{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:10px 16px;box-shadow:var(--shadow)}
.clock{font-family:Fraunces,serif;font-weight:800;font-size:clamp(2.6rem,10vw,4.2rem);line-height:1;font-variant-numeric:tabular-nums;min-width:4.2ch}
.clock.lowt{color:var(--warn)} .clock.over{color:var(--bad)}
.prog{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s linear}
.prog.lowt i{background:var(--warn)}
.stitle{font-weight:700;font-size:1rem;line-height:1.2}
/* station text */
.enon p{margin:0 0 .7em;font-size:1.1rem}
.qs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.qs li{display:flex;gap:12px;font-size:1.08rem;background:var(--surface2);border-radius:16px;padding:12px 14px}
.qs li b{font-family:Fraunces,serif;color:var(--accent);font-size:1.25rem;min-width:1.6em}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.imgs img{max-width:100%;border-radius:16px;border:2px solid var(--line);background:#fff;cursor:zoom-in;max-height:52vh;object-fit:contain}
.imgs.two img{max-width:calc(50% - 5px)}
table.au{border-collapse:collapse;width:100%;font-size:1.05rem;background:var(--surface)}
table.au th,table.au td{border:2px solid var(--line);padding:.45em .5em;text-align:center}
table.au th{background:var(--surface2)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:10px}
.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:10px}
/* grid */
.qblock{margin-bottom:16px}
.qhead{display:flex;gap:10px;align-items:baseline;margin:0 0 8px;font-weight:700;color:var(--muted);font-size:.9rem}
.qhead b{font-family:Fraunces,serif;color:var(--accent);font-size:1.2rem}
.item{width:100%;text-align:left;display:flex;gap:14px;align-items:flex-start;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 14px;margin-bottom:8px;font-size:1.02rem;line-height:1.3;min-height:3.6rem}
.box{flex:none;width:2rem;height:2rem;border-radius:10px;border:3px solid var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;color:transparent;margin-top:-2px}
.item.on{border-color:var(--good);background:var(--goodbg)}
.item.on .box{background:var(--good);border-color:var(--good);color:#fff}
.pts{flex:none;margin-left:auto;font-weight:700;font-size:.8rem;color:var(--muted);white-space:nowrap;padding-top:.15em}
.crit{color:var(--bad);font-weight:800;font-size:.75rem;letter-spacing:.04em}
.livescore{font-family:Fraunces,serif;font-weight:800;font-size:1.6rem}
/* results */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{--p:0;width:clamp(150px,34vw,210px);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--rc,var(--accent)) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:78%;aspect-ratio:1;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font-family:Fraunces,serif;font-size:clamp(2.6rem,9vw,3.6rem);line-height:1}
.res-item{display:flex;gap:12px;padding:12px 14px;border-radius:16px;margin-bottom:8px;font-size:1rem;line-height:1.35}
.res-item.ok{background:var(--goodbg)}
.res-item.ko{background:var(--badbg)}
.res-item .s{font-weight:800;font-size:1.2rem;flex:none;width:1.4em}
.res-item.ok .s{color:var(--good)} .res-item.ko .s{color:var(--bad)}
.res-item .ex{display:block;color:var(--muted);font-size:.92rem;margin-top:4px}
.critbox{border:3px solid var(--bad);background:var(--badbg);border-radius:18px;padding:14px 16px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;padding:.35em .8em;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}
.status i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--good)} .status.wait i{background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.waitbig{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:30px 0}
.waitbig .ico{font-size:4rem}
.two-col{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:900px){.two-col{grid-template-columns:1.1fr 1fr}.two-col.st{grid-template-columns:1.25fr 1fr}}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
.da-in{font:inherit;font-size:1.4rem;width:6ch;padding:.3em .4em;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.foot{margin-top:auto;padding-top:24px;font-size:.78rem;color:var(--muted);text-align:center}
.top .row{flex-wrap:nowrap}
@media (max-width:600px){.top .brand .bt{display:none}.score{flex-direction:column;align-items:stretch;text-align:left}.ring{align-self:center}.status{font-size:.78rem}}
.tbar{padding:6px 0 8px;margin:-4px 0 10px}
.tin{padding:6px 8px 6px 14px;gap:10px;border-radius:16px}
.tl{min-width:0}
.stitle{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.prog{height:5px;margin-top:5px}
.clock{font-size:clamp(1.7rem,6.5vw,2.5rem);min-width:3.6ch;text-align:right}
.tctl{display:flex;gap:6px;flex:none}
.tctl .btn{min-height:2.6rem;padding:.3em .8em;font-size:.9rem;border-radius:12px;box-shadow:none}
.btn.icon{min-width:2.5rem;padding:.3em .5em;font-size:1rem}
.item .it{display:block}
.item .det{display:block;margin-top:6px;font-size:.86rem;line-height:1.35;color:var(--muted);font-weight:400}
.item.on .det{color:var(--ink);opacity:.75}
@media (max-width:600px){.stt,.hq{display:none}.top{gap:6px}.top .row{gap:6px}}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:20;border:0;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.78rem;padding:.55em .85em;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;align-items:center;gap:.3em}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:1000px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.sheet-top .btn{white-space:nowrap;flex:none}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0}
.wrap{padding-bottom:90px}
@media (max-width:420px){.tctl .btn{padding:.3em .55em}.tin{gap:6px;padding-left:10px}}
.copy{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(6px,env(safe-area-inset-bottom));z-index:15;font-size:11px;color:var(--muted);opacity:.85;pointer-events:none;letter-spacing:.02em;background:var(--bg);padding:1px 7px;border-radius:8px}
.tplay{margin-top:6px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:4px 10px 6px}
.tplay audio{width:100%;height:40px;display:block;margin-top:2px}
.btn.recgo{background:#c81e1e;border-color:#c81e1e;color:#fff}
.recc{padding:14px 16px;margin-bottom:14px}
.recc audio{width:100%;margin-top:8px}
.recdot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#e02424;margin-right:.35em;vertical-align:middle;animation:pulse 1s infinite}
.btn.recon{border-color:#e02424;color:#e02424}
.qr{width:min(62vw,260px);background:#fff;padding:8px;border-radius:18px}.qr svg{display:block;width:100%;height:auto}
.flash{animation:fl .8s ease 3}
@keyframes fl{50%{box-shadow:0 0 0 7px rgba(224,36,36,.35)}}
</style>

        var b2 = read();
        var b3 = read();

      var bytes = [];

        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

const STATIONS = [{"id":"01","titre":"Eczéma des mains aux détergents","court":"Détergents","theme":"Peau","imgs":["s1"],"enonce":["Vous êtes médecin du travail. Un homme de 35 ans, ouvrier dans une usine de fabrication de détergents depuis 5 ans, consulte pour un prurit des deux mains évoluant depuis 2 mois.","Il présente un érythème, une desquamation, quelques vésicules et des fissures douloureuses.","Les lésions s'aggravent pendant les journées de travail et s'améliorent pendant les congés.","Il manipule quotidiennement des détergents et des produits chimiques et porte des gants de protection."],"questions":["Quel est votre diagnostic ? Quels sont les deux principaux mécanismes physiopathologiques à distinguer ?","Quels éléments recherchez-vous à l'interrogatoire et lors de l'enquête professionnelle ?","Décrivez les signes cliniques de l'eczéma de contact et différenciez la dermatite irritative de l'eczéma allergique.","Quels examens complémentaires demandez-vous ? Décrivez le principe et la réalisation du patch-test.","Quels sont les principaux diagnostics différentiels ?","Quelle prise en charge thérapeutique proposez-vous ? Quelles sont les mesures de prévention collective, individuelle et médicale ?","Quels sont les aspects médico-légaux de cette affection en Algérie ? Précisez les tableaux concernés, notamment le TMP 64."],"grille":[[1,2,1,"Eczéma de contact professionnel des mains","Lésions des deux mains rythmées par le travail (aggravation au travail, amélioration pendant les congés) chez un ouvrier exposé aux détergents."],[1,2,0,"Distingue les 2 mécanismes : irritatif et allergique","Irritatif : non immunologique, altération directe de la barrière cutanée. Allergique : hypersensibilité retardée de type IV, sensibilisation préalable, la réexposition déclenche l'eczéma."],[2,1,0,"Chronologie : début, évolution, rythme travail / congés","Le rythme professionnel est l'argument clé du lien avec le travail."],[2,1,0,"Antécédents d'eczéma atopique ou de dyshidrose","Un terrain atopique favorise la dermatite et oriente les diagnostics différentiels."],[2,1,0,"Postes antérieurs, gestes, produits manipulés et fiches de données de sécurité (FDS)","L'enquête professionnelle identifie l'agent causal : composition des produits via les FDS."],[2,1,0,"Protections (gants, collectives) et collègues atteints","Une atteinte collective oriente vers l'irritation ; elle évalue aussi l'efficacité des protections."],[3,1,0,"Signes : érythème, vésicules, suintement, croûtes, desquamation, fissures, lichénification","Examiner tout le tégument et chercher une surinfection."],[3,2,0,"Irritative vs allergique : brûlure / prurit, limites nettes / mal définies, contact / extension, patch-test − / +","Irritative : précoce, collective, sèche et squameuse, limitée au contact. Allergique : 24–48 h, individuelle, érythémato-vésiculeuse, extension possible à distance."],[4,2,1,"Patch-test = examen de référence (hypersensibilité type IV)","C'est lui qui identifie l'allergène et permet la reconnaissance au TMP 64."],[4,1,0,"Réalisation : dos, occlusion 48 h, lectures à 48 h puis jusqu'à 96 h","Batterie standard + professionnelle + produits suspects préparés de façon appropriée."],[4,1,0,"Conditions : 2 semaines après guérison, pas de dermocorticoïde sur le dos (1 sem.), pas de corticoïde général (1 mois)","Les antihistaminiques n'ont pas d'effet sur le test. Autres : prick-test (immédiat), open-test, semi-open-test."],[5,1,0,"Cite au moins 3 DD : dermatite atopique, psoriasis palmo-plantaire, dyshidrose, dermatophytie, gale","Dermatite atopique (antécédents, plis), psoriasis (plaques bien limitées, ongles), dyshidrose (vésicules des faces latérales des doigts), dermatophytie (souvent unilatérale, prélèvement), gale (sillons, prurit nocturne)."],[6,1,0,"Traitement : éviction, dermocorticoïdes, émollients, traitement d'une surinfection","Éviction de l'agent causal ; dermocorticoïdes adaptés ; émollients ; traiter une surinfection ; surveiller l'évolution."],[6,1,0,"Prévention collective : substitution, réduction du contact, circuits fermés, automatisation, ventilation","La prévention collective passe toujours avant la protection individuelle."],[6,1,0,"Prévention individuelle : gants adaptés, pas de solvants pour se laver, hydratation","Éviter le contact prolongé avec les caustiques ; hydrater après le travail."],[6,1,0,"Surveillance médicale : visite d'embauche et périodique, aménagement ou retrait du poste","Visite d'embauche et visites périodiques ; recherche de signes d'intolérance cutanée, muqueuse ou respiratoire ; suivi et éventuel retrait du poste dangereux."],[7,2,1,"TMP 64 : lésions eczématiformes allergiques, DPC 30 jours","Loi 83-13 du 2 juillet 1983. Autres tableaux possibles selon l'agent : 10 (chrome), 35 (lubrifiants), 36 (nickel)."],[7,1,0,"Condition : récidive après réexposition OU patch-test positif","Agent et travaux prévus au tableau."],[7,1,0,"Dermite irritative aux détergents sans tableau → déclaration en MCP","Une brûlure chimique brutale relève de l'accident du travail."]]},{"id":"02","titre":"Coiffeuse et teintures (PPD)","court":"Coiffeuse","theme":"Peau","imgs":["s2"],"enonce":["Vous recevez en consultation de médecine du travail une coiffeuse âgée de 28 ans, exerçant depuis 6 ans dans un salon de coiffure.","Depuis 3 semaines, elle présente un prurit intense du cuir chevelu, du visage et du cou, associé à un érythème et à des lésions vésiculeuses suintantes, prédominant au niveau du contour du visage et des régions rétro-auriculaires.","Elle rapporte une aggravation après la réalisation des colorations capillaires chez les clientes. Les symptômes s'améliorent partiellement pendant les jours de repos.","Elle manipule régulièrement des teintures capillaires sans toujours porter de gants adaptés."],"questions":["Quel est votre diagnostic le plus probable ? Précisez le mécanisme physiopathologique et l'allergène professionnel suspecté.","Quels éléments recherchez-vous à l'interrogatoire ? Quels produits et documents professionnels devez-vous identifier ?","Quels éléments de l'examen clinique recherchez-vous ? Décrivez les lésions typiques et les particularités de la topographie.","Quels examens complémentaires demandez-vous ? Quel est l'examen de référence ? Modalités de réalisation et de lecture.","Quels sont les principaux diagnostics différentiels ?","Quelle est votre conduite thérapeutique et préventive (patiente, salon de coiffure) ?","Quels sont les aspects médico-légaux en Algérie ? Quel tableau, quelles conditions de reconnaissance ?"],"grille":[[1,2,1,"Eczéma allergique de contact professionnel aux teintures","Prurit, vésicules suintantes, topographie du contour du visage, aggravation après les colorations."],[1,2,1,"Allergène : paraphénylènediamine (PPD)","Amine aromatique des teintures d'oxydation : l'allergène majeur de la coiffure."],[1,1,0,"Mécanisme type IV : sensibilisation (haptène) puis déclenchement à 24–48 h par les LT mémoires","Extension possible au-delà de la zone de contact."],[2,1,0,"Chronologie et lien avec les colorations ; amélioration au repos","Point clé : le lien chronologique exposition → lésions."],[2,1,0,"Antécédents d'atopie, épisodes antérieurs après coloration","Eczéma atopique ou dyshidrose ; traitements déjà pris ; épisodes antérieurs survenus après une coloration."],[2,1,0,"Tâches (préparation, application, rinçage), produits, composition et FDS","Teintures, décolorants, shampoings… identifier la PPD dans la composition."],[2,1,0,"Port de gants, ventilation, collègues atteints","Gants portés ou non, et lesquels ; ventilation du salon ; protections collectives ; symptômes chez les collègues."],[3,1,0,"Lésions : érythème, vésicules, suintement, croûtes, desquamation","Lésions polymorphes et prurigineuses ; examiner tout le tégument."],[3,1,0,"Topographie : lisière du cuir chevelu, visage, rétro-auriculaire, cou, mains","Extension possible par transfert manuel."],[4,2,1,"Patch-tests = examen de référence (batterie standard + coiffure + PPD)","Recherche une hypersensibilité retardée de type IV : batterie standard, batterie coiffure et PPD."],[4,1,0,"Dos, occlusion 48 h, lectures 48 h → 96 h ; cotation ICDRG (−, ?, +, ++, +++)","Lecture 30 min après le retrait des patchs."],[4,1,0,"Pertinence : confronter un test positif à l'exposition réelle","Un patch-test positif n'a de valeur que s'il correspond à un produit réellement manipulé au travail."],[5,1,0,"DD : angio-œdème, urticaire de contact, dermatite irritative, atopique, séborrhéique","Angio-œdème : œdème brutal et profond ; séborrhéique : squames grasses, sourcils."],[6,1,0,"Éviction de l'allergène, dermocorticoïdes, émollients","Arrêt de la manipulation des teintures responsables ; dermocorticoïdes ; émollients ; traitement d'une surinfection."],[6,1,0,"Collective : substitution, réduction des contacts, préparation sécurisée, ventilation, formation","Substitution des produits allergisants, réduction des contacts, systèmes de préparation sécurisés, ventilation, formation des travailleurs."],[6,1,0,"Individuelle : gants adaptés changés si contaminés, jamais de solvants sur la peau","Lavage adapté et hydratation des mains."],[6,1,0,"Surveillance et adaptation du poste si l'éviction est impossible","Suivi des lésions ; aménagement du poste si l'éviction professionnelle est impossible."],[7,2,1,"TMP 15 (amines aromatiques) : dermites eczématiformes","La PPD est une amine aromatique ; le TMP 64 est l'alternative générale."],[7,1,0,"DPC 15 jours, liste indicative","Délai de prise en charge 15 jours ; liste des travaux indicative."],[7,1,0,"Condition : récidive après réexposition ou patch-test positif au produit","Récidive après une nouvelle exposition, ou patch-test positif au produit manipulé."]]},{"id":"03","titre":"Mécanicien et dermatite irritative","court":"Mécanicien","theme":"Peau","imgs":["s3"],"enonce":["Vous recevez en consultation de médecine du travail un mécanicien automobile de 42 ans, exerçant depuis 15 ans dans un garage.","Depuis environ 2 mois, il présente une sécheresse cutanée des deux mains, avec rougeurs, desquamation et fissures douloureuses, surtout aux doigts et aux espaces interdigitaux.","Il rapporte une sensation de brûlure plus importante que le prurit. Les lésions s'aggravent au cours de la semaine de travail et s'améliorent pendant les congés.","Il est exposé aux huiles de moteur, graisses, carburants, détergents et solvants. Il utilise parfois du gasoil ou des solvants pour nettoyer ses mains et ne porte pas systématiquement de gants."],"questions":["Quel est le diagnostic probable ? Quel est son mécanisme et quels sont les facteurs professionnels responsables ?","Quels éléments recherchez-vous à l'interrogatoire ?","Quels sont les signes cliniques caractéristiques et comment distinguer cette dermatite d'un eczéma allergique ?","Quels examens complémentaires demandez-vous ? Quelle est la place des patch-tests ?","Quels sont les principaux diagnostics différentiels ?","Quelle est votre conduite thérapeutique et préventive ?","Quels sont les aspects médico-légaux en Algérie ?"],"grille":[[1,2,1,"Dermatite irritative de contact professionnelle des mains","Brûlure > prurit, lésions sèches et fissurées, limitées aux zones de contact."],[1,1,0,"Mécanisme non immunologique, par expositions répétées","Altération directe de la barrière cutanée sans sensibilisation : peut toucher tous les exposés."],[1,1,0,"Agents : huiles, graisses, carburants, solvants, détergents ; aggravé par le gasoil pour se laver","Huiles de moteur, graisses, carburants, solvants, détergents, lavages répétés ; facteur aggravant : gasoil ou solvants pour se laver les mains."],[2,1,0,"Chronologie, symptôme dominant, rythme travail / congés","Début, évolution, brûlure plus que prurit, amélioration pendant les congés."],[2,1,0,"Tâches, produits, fréquence et durée des contacts","Quelles tâches, quels produits, combien de fois et combien de temps par jour."],[2,1,0,"Gants, moyens de lavage, FDS, collègues ; antécédents d'atopie","Port de gants, moyens de lavage disponibles, FDS, collègues atteints ; antécédents d'eczéma atopique ou de dermatose des mains."],[3,1,0,"Xérose, érythème, desquamation fine, hyperkératose, fissures","Xérose, érythème, desquamation fine, hyperkératose, fissures douloureuses ; brûlure et douleur au premier plan."],[3,1,0,"Doigts, espaces interdigitaux, paumes ; limité aux zones de contact","Régression en quelques jours à semaines après l'arrêt de l'exposition."],[3,2,0,"Oppose à l'allergique : brûlure / prurit, sec / vésiculeux, limité / extension, patch-test − / +","Irritatif : non immunologique, brûlure, lésions sèches et fissurées, limité au contact, patch-tests négatifs. Allergique : type IV, prurit, vésicules et suintement, extension possible, patch-tests positifs."],[4,1,0,"Diagnostic essentiellement clinique et professionnel","Pas d'examen indispensable : le diagnostic repose sur la clinique et l'enquête professionnelle."],[4,1,0,"Patch-tests non systématiques : seulement si suspicion d'allergie associée","Sous occlusion 48 h, lectures à 48 et 96 h."],[4,1,0,"Prélèvement mycologique ou bactériologique selon la clinique","Si suspicion de surinfection ou de dermatophytie."],[5,1,0,"DD : eczéma allergique, eczéma atopique, psoriasis, dyshidrose, dermatophytie","Eczéma allergique de contact, eczéma atopique des mains, psoriasis palmoplantaire, dyshidrose, dermatophytie."],[6,1,0,"Éviction / réduction des irritants, émollients, dermocorticoïdes si inflammation","Éviction ou réduction des irritants ; émollients réguliers ; dermocorticoïdes si inflammation ; soins des fissures."],[6,2,1,"Ne jamais se laver les mains au gasoil ou aux solvants","C'est le facteur aggravant majeur du cas : le citer est attendu."],[6,1,0,"Collective (substitution, automatisation, lavage adapté) et individuelle (gants, lavage doux, hydratation)","Collective : substitution, réduction des contacts, automatisation, lavage adapté. Individuelle : gants adaptés, lavage doux, séchage, hydratation."],[6,1,0,"Surveillance périodique et adaptation du poste","Surveillance médicale périodique ; adaptation du poste si nécessaire."],[7,2,1,"TMP 84 : dermo-épidermite irritative (DPC 7 j) ; dermite eczématiforme (DPC 15 j)","Tableau des solvants organiques liquides."],[7,1,0,"Si eczéma allergique associé : TMP 64 (DPC 30 j, récidive ou patch-test +)","Agent et travaux prévus au tableau ; récidive après réexposition ou patch-test positif ; délai de prise en charge 30 jours."]]},{"id":"04","titre":"Maçon et ciment","court":"Maçon","theme":"Peau","imgs":["s4"],"enonce":["Vous recevez en consultation de médecine du travail un maçon de 38 ans, exerçant dans le secteur du bâtiment depuis 12 ans.","Depuis 3 mois, il présente des lésions cutanées des mains, prédominant aux doigts et aux espaces interdigitaux. Il décrit un prurit important, avec rougeurs, vésicules et fissures douloureuses.","Les symptômes s'aggravent pendant les journées de travail et s'améliorent partiellement pendant les congés.","Il manipule quotidiennement du ciment humide sans porter systématiquement de gants de protection."],"questions":["Quel est votre diagnostic probable ? Quels sont les deux mécanismes possibles de dermatite liée au ciment ?","Quels éléments recherchez-vous à l'interrogatoire et dans l'enquête professionnelle ?","Décrivez les signes cliniques et les localisations caractéristiques.","Quels examens complémentaires demandez-vous ? Quelle est la place des patch-tests ?","Quels sont les principaux diagnostics différentiels ?","Quelle est votre conduite thérapeutique et préventive ?","Quels sont les aspects médico-légaux en Algérie ? Quel tableau évoquez-vous ?"],"grille":[[1,2,1,"Dermatite de contact professionnelle au ciment","Lésions des mains au contact du ciment humide, rythmées par le travail."],[1,2,0,"Irritative (action directe du ciment humide) ou allergique type IV aux chromates (Cr VI)","Le chrome hexavalent du ciment est l'allergène."],[2,1,0,"Chronologie, rythme travail / congés, antécédents d'atopie","Début, prurit, brûlure, douleur, amélioration pendant les congés ; antécédents d'eczéma atopique ou de dermatose."],[2,1,0,"Tâches : préparation, transport, application ; contact au ciment humide, fréquence","Ancienneté ; préparation, transport et application du ciment ; fréquence et durée du contact avec le ciment humide."],[2,1,0,"Gants, lavage, protections collectives, FDS, collègues","Port de gants, moyens de lavage, protections collectives, FDS, symptômes chez les collègues."],[3,1,0,"Érythème, vésicules, suintement ; chronique : hyperkératose, fissures, lichénification","Aigu : érythème, vésicules, prurit, suintement, croûtes, desquamation. Chronique : sécheresse, hyperkératose, fissures, lichénification ; surtout doigts et espaces interdigitaux."],[3,2,0,"Gale du ciment : face dorsale des index et médius, périunguéale → main de cimentier","Main de cimentier : œdème, hyperkératose, callosités, érosions, fissures."],[3,1,0,"Atteinte possible des poignets et avant-bras dans l'allergie","Selon les zones exposées au ciment."],[4,2,1,"Patch-tests (chromates) = référence ; dos, 48 h, lectures 48–96 h","Un test positif est à confronter à l'exposition."],[4,1,0,"Négatifs dans l'irritative pure ; mycologie si doute","Patch-tests négatifs dans une dermatite irritative pure ; prélèvement mycologique si suspicion de dermatophytie."],[5,1,0,"DD : irritative, atopie, dyshidrose, psoriasis, dermatophytie, gale","Dermatite irritative, eczéma atopique des mains, dyshidrose, psoriasis palmoplantaire, dermatophytie, gale."],[6,1,0,"Éviction / réduction du contact, dermocorticoïdes, émollients, soins des fissures","Éviction ou réduction du contact ; dermocorticoïdes ; émollients ; soins des fissures ; traiter une surinfection."],[6,2,0,"Ciment pauvre en Cr VI (additionné de sulfate ferreux)","Mesure de substitution spécifique et classique du ciment."],[6,1,0,"Gants nitrile doublés de coton, vêtements, lavage rapide, séchage, hydratation","Gants nitrile doublés de coton, vêtements de protection, lavage rapide après contact, séchage soigneux, hydratation ; éviter le contact prolongé avec le ciment humide."],[6,1,0,"Surveillance, adaptation ou retrait du poste","Dépistage précoce ; adaptation ou retrait du poste si nécessaire."],[7,2,1,"TMP 8 : maladies causées par les ciments","La reconnaissance dépend de l'agent causal, de l'exposition et des conditions du tableau."],[7,1,0,"TMP 10 : acide chromique, chromates et bichromates","Si l'allergie aux chromates est démontrée."],[7,1,0,"Brûlure chimique aiguë après un événement brutal → accident du travail","Brûlure aiguë après un événement brutal : relève de l'accident du travail, pas de la maladie professionnelle."]]},{"id":"05","titre":"Infirmière et latex","court":"Latex","theme":"Peau","imgs":["s5a","s5b"],"enonce":["Mme B., 29 ans, est infirmière dans un service de chirurgie depuis 5 ans. Elle consulte en médecine du travail pour des manifestations cutanées et respiratoires survenant pendant son activité.","Depuis plusieurs mois, elle présente des démangeaisons des mains, suivies de rougeurs et de plaques d'urticaire quelques minutes après le port de gants médicaux. Elle rapporte aussi des éternuements, une rhinorrhée et parfois une gêne respiratoire pendant les soins.","Les symptômes diminuent pendant les jours de repos et disparaissent presque complètement durant les congés.","Antécédent d'allergie alimentaire à la banane et au kiwi. Examen : quelques lésions érythémateuses des mains, sans détresse respiratoire."],"questions":["Quel est le diagnostic le plus probable ? Argumentez à partir des éléments cliniques et professionnels.","Quel est l'agent responsable ? Expliquez le mécanisme physiopathologique.","Quels sont les principaux signes cliniques et les différentes manifestations possibles de cette allergie ?","Quels diagnostics différentiels évoquer devant des lésions cutanées liées au port de gants ?","Quels examens complémentaires demandez-vous pour confirmer le diagnostic et identifier le mécanisme ?","Quelle est votre conduite à tenir thérapeutique et professionnelle ?","Quelles mesures de prévention mettre en place dans le milieu professionnel ?"],"grille":[[1,2,1,"Allergie professionnelle immédiate au latex (type I)","Urticaire de contact et rhinite quelques minutes après les gants chez une infirmière : allergie IgE-médiée."],[1,1,0,"Arguments : gants médicaux, symptômes en quelques minutes, amélioration en congés","Gants médicaux, symptômes en quelques minutes, prurit, érythème, urticaire, rhinite, amélioration à l'éviction (repos, congés)."],[1,1,0,"Syndrome latex-fruits (banane, kiwi)","Réactivité croisée : terrain très évocateur."],[2,1,0,"Agent : protéines du latex naturel ; voie cutanée et inhalée (poudre des gants)","Contact cutané avec les gants et inhalation des particules allergéniques portées par la poudre des gants."],[2,1,0,"Mécanisme IgE : sensibilisation puis dégranulation mastocytaire (histamine)","Production d'IgE spécifiques ; à la réexposition, activation des mastocytes et libération d'histamine et d'autres médiateurs."],[3,1,0,"Cutané : prurit, urticaire de contact, œdème, angio-œdème","Prurit, urticaire de contact, œdème, angio-œdème."],[3,1,0,"Respiratoire : rhinite, conjonctivite, toux, asthme","Rhinite, éternuements, conjonctivite ; toux, sifflements, asthme professionnel."],[3,1,0,"Général : anaphylaxie, choc anaphylactique","Anaphylaxie, hypotension, choc anaphylactique."],[4,1,0,"Dermatite irritative (lavages répétés, occlusion)","Fréquente, liée aux lavages répétés, aux détergents et à l'occlusion ; sans mécanisme immunologique."],[4,1,0,"Eczéma allergique type IV aux additifs (thiurames, carbamates, MBT)","Protéines du latex (immédiat) ≠ additifs du caoutchouc (retardé)."],[5,2,1,"Prick-tests au latex, en milieu spécialisé","Risque de choc anaphylactique."],[5,1,0,"IgE spécifiques anti-latex","Confirme la sensibilisation."],[5,1,0,"Patch-tests si eczéma ; EFR ± réversibilité si asthme","Patch-tests si eczéma retardé aux additifs ; EFR ± réversibilité si suspicion d'asthme. Un test positif isolé ne prouve pas une allergie symptomatique."],[6,2,1,"Éviction du latex : gants nitrile ou néoprène","Mesure essentielle : remplacer par des gants sans latex (nitrile ou néoprène selon l'usage)."],[6,1,0,"Antihistaminiques ; adrénaline IM si anaphylaxie","Antihistaminiques pour l'urticaire et le prurit ; dermocorticoïdes si eczéma ; traitement de l'asthme ; adrénaline IM en urgence si anaphylaxie."],[6,1,0,"Aptitude avec aménagement ; inaptitude en dernier recours","Évaluer l'aptitude et aménager le poste ; l'inaptitude ne vient qu'en dernier recours."],[7,1,0,"Primaire : gants sans latex non poudrés pour l'équipe, formation","Substitution des gants en latex, suppression des gants poudrés, information et formation du personnel."],[7,1,0,"Secondaire / tertiaire : dépistage, environnement sans latex, signalement au dossier","Surveillance des exposés, dépistage précoce, éviction chez l'allergique, environnement sans latex, signalement dans le dossier médical."],[7,2,0,"Médico-légal : MCP (latex absent des tableaux) ; TMP 64 réservé aux additifs","L'asthme au latex n'est pas dans la liste limitative du TMP 65 : MCP aussi."]]},{"id":"06","titre":"Meuleur et surdité (ECOS 2024)","court":"Meuleur","theme":"Bruit","imgs":["a6"],"enonce":["Homme. Biométrie : taille 1,70 m ; poids 70 kg ; TA 12/07.","Interrogatoire : le travailleur fait répéter à voix haute ; il rapporte une notion de fatigue, des bourdonnements d'oreille bilatéraux et une hypoacousie bilatérale, sans vertige.","Examen otoscopique : tympan intact, non perforé, pas de bouchon de cérumen, pas de polype, pas d'otite. Examen des autres appareils : sans particularité.","Employeur : société de BTP, atelier de soudage de charpente métallique. Poste : meuleur ; prépare des plaques métalliques à la soudure avec des outils de meulage."],"table":{"head":["Oreille","500","1000","2000","4000","8000"],"rows":[["Droite",15,35,45,50,40],["Gauche",20,40,50,55,45]],"cap":"Audiométrie (perte en dB)"},"questions":["Quel examen complémentaire demandez-vous pour confirmer votre diagnostic ? Précisez ses conditions de réalisation, les oreilles, les fréquences et les conductions explorées, ainsi que son intérêt diagnostique et médico-légal.","Quel type d'atteinte évoquez-vous ? Sur quels arguments ?","Autres éléments à rechercher pour étayer le diagnostic.","Cette pathologie est-elle indemnisable ? Critères de reconnaissance, TMP, DPC, durée d'exposition, type de liste, puis calculez le déficit moyen.","Rédigez le certificat.","Déclaration de la pathologie : qui déclare ? à qui ? dans quel délai ?","Conseils du médecin du travail pour ce travailleur."],"grille":[[1,2,1,"Audiométrie tonale liminaire","L'examen qui confirme et chiffre la surdité."],[1,1,0,"Cabine insonorisée, repos auditif ≥ 16 h, otoscopie préalable","Audiomètre étalonné, opérateur formé."],[1,1,0,"Deux oreilles séparément, CA et CO, 500 – 1000 – 2000 – 4000 Hz","Ce sont les 4 fréquences du calcul du DA."],[1,1,0,"Intérêt diagnostique (type, sévérité) et médico-légal (calcul du DA, TMP 42)","Diagnostique : confirme l'hypoacousie, précise le type (perception ou transmission) et la sévérité. Médico-légal : calcul du DA pour la reconnaissance et l'indemnisation (TMP 42)."],[2,2,1,"Surdité de perception bilatérale cochléaire due au bruit (meulage)","Perception (CA = CO), bilatérale, par lésion cochléaire, chez un meuleur exposé au bruit."],[2,1,0,"Arguments : hypoacousie, acouphènes, otoscopie normale, aigus atteints, poste exposé","Fait répéter, hypoacousie et bourdonnements bilatéraux, pas de vertige ; tympan normal (élimine la transmission) ; déficit croissant de 500 à 4000 Hz."],[3,1,0,"Traumatisme, HTA / diabète, ATCD ORL, surdité familiale, ototoxiques, CO","Traumatisme crânien ou auriculaire ; HTA, diabète ; ATCD ORL (Ménière, otospongiose) ; surdité familiale ; aminosides ; co-exposition au CO."],[4,2,0,"Critères : bilatéral, perception, ≥ 35 dB meilleure oreille, irréversible, confirmé 3 sem. – 1 an après l'arrêt","Déficit bilatéral de perception par lésion cochléaire, d'au moins 35 dB sur la meilleure oreille, irréversible, ne s'aggravant plus après l'arrêt ; confirmé par une audiométrie 3 semaines à 1 an après l'arrêt."],[4,2,1,"TMP 42 : DPC 1 an, durée d'exposition 1 an, liste limitative","DPC 1 an après la fin de l'exposition ; durée d'exposition d'au moins 1 an ; liste limitative : la profession doit y figurer."],[4,2,1,"DA OD = 35,5 dB ; DA OG = 40,5 dB","DA = [2×500 + 4×1000 + 3×2000 + 1×4000] / 10. OD = (30+140+135+50)/10 = 35,5 ; OG = (40+160+150+55)/10 = 40,5."],[4,1,0,"Meilleure oreille droite 35,5 dB → indemnisable, à confirmer par un 2e audiogramme","Le DA se juge sur la meilleure oreille : 35,5 dB, donc au moins 35 dB."],[5,1,0,"Certificat : identité, employeur, poste exposant, constat chiffré (DA OD / OG), date et signature","Ex. : « Surdité professionnelle de perception bilatérale avec DA (D) = 35,5 dB et DA (G) = 40,5 dB »."],[6,1,0,"CMI ; le patient (ou ses ayants droit) déclare à la CNAS, 15 j au minimum – 3 mois au maximum","Qui : le patient ou ses ayants droit. À qui : la CNAS. Délai : 15 jours au minimum, 3 mois au maximum."],[7,1,0,"Réduction du bruit à la source (encoffrement), limitation du temps, rotation ; PICB en complément","Organisation : limiter le temps en milieu bruyant, rotation des postes. Technique : réduire à la source, encoffrement. PICB en complément. Surveillance audiométrique."]]},{"id":"07","titre":"Métallurgiste et surdité","court":"Métallurgiste","theme":"Bruit","imgs":["a7"],"enonce":["Homme de 49 ans, ouvrier en métallurgie (emboutissage, meulage, marteau pneumatique). Exposé depuis 18 ans à un bruit moyen de 92 à 95 dB(A) sur 8 h/j, avec des pics impulsionnels. Co-exposition intermittente à des solvants (dégraissage).","Depuis 2 à 3 ans, il fait répéter, a une gêne en réunion et des acouphènes surtout après le travail, avec une sensation d'oreilles bouchées. Pas de vertiges francs.","Examen : tympans normaux, pas d'otite chronique. L'audiométrie vocale montre une compréhension moins bonne que ce que laisse croire l'audiométrie tonale.","Muté il y a 2 mois à un poste « calme ». Une audiométrie tonale a été faite 2 mois après la mutation."],"questions":["Lisez l'audiogramme : rapport entre conduction aérienne et osseuse, forme générale du tracé, symétrie entre les deux oreilles.","Quel type d'atteinte évoquez-vous ? Arguments (clinique, audiométrie, exposition), puis stade de la surdité professionnelle.","Quels diagnostics différentiels discutez-vous, quels arguments les écartent, et que recherchez-vous à l'interrogatoire ?","Calculez le DA réglementaire de chaque oreille (formule du tableau 42), précisez la meilleure oreille et concluez.","Peut-elle être reconnue en maladie professionnelle ? Tableau, critères, DPC, durée d'exposition, liste ; vérifiez chaque condition.","Comment évalue-t-on l'exposition au bruit au poste ? Matériel, grandeur, seuil, bruits impulsionnels, règle des 3 dB.","Conduite à tenir du médecin du travail : pour le patient, puis pour le poste et l'entreprise."],"grille":[[1,1,0,"CA et CO superposées : pas d'écart air-os","Les deux courbes se confondent : atteinte de perception."],[1,1,0,"Tracé descendant avec encoche à 4 kHz","Courbe qui descend vers les aigus, maximum à 4 kHz, puis remontée à 8 kHz."],[1,1,0,"Bilatérale, quasi symétrique (OG un peu plus atteinte)","Les deux oreilles sont atteintes de façon comparable."],[2,2,1,"Surdité de perception bilatérale cochléaire due au bruit","Perception, bilatérale, cochléaire, d'origine professionnelle."],[2,1,0,"Arguments : 18 ans à 92–95 dB(A), impulsionnels, vocale discordante, tympans normaux","18 ans à 92–95 dB(A) avec pics impulsionnels ; fait répéter, gêne en réunion, acouphènes, oreilles bouchées ; tympans normaux ; vocale moins bonne que la tonale."],[2,1,0,"3e stade : fréquences conversationnelles atteintes, gêne sociale","Atteinte autour de 1000 Hz avec un déficit dépassant 30 dB."],[3,1,0,"Écarte presbyacousie, TSA, otospongiose, Ménière, neurinome","Presbyacousie : plus tardive, sans encoche. TSA : brutal, souvent unilatéral. Neurinome : asymétrique."],[3,1,0,"Ototoxiques / solvants co-facteur ; rechercher traumatisme, HTA, diabète, ATCD, CO","Les solvants (dégraissage) aggravent l'atteinte. À rechercher : traumatisme crânien, HTA, diabète, antécédents d'oreille, surdité familiale, ototoxiques, CO."],[4,2,1,"DA OD = 42 dB ; DA OG = 49 dB","OD = (2×25 + 4×40 + 3×45 + 75)/10 = 420/10. OG = (2×30 + 4×45 + 3×55 + 85)/10 = 490/10."],[4,1,0,"Meilleure oreille = droite, 42 dB > 35 → critère rempli","Le DA retenu est celui de la meilleure oreille, la moins atteinte."],[5,2,1,"TMP 42 : DPC 1 an, durée d'exposition ≥ 1 an (ici 18 ans), liste limitative","Déficit bilatéral de perception cochléaire d'au moins 35 dB sur la meilleure oreille, irréversible ; reconnaissance possible si le métier figure dans la liste limitative."],[5,1,0,"Audiogramme à 2 mois de la mutation : dans la fenêtre 3 sem. – 1 an","La confirmation se fait entre 3 semaines et 1 an après l'arrêt de l'exposition."],[6,1,0,"Sonomètre intégrateur ou exposimètre ; Leq 8 h en dB(A)","Exposimètre porté toute la journée ou sonomètre intégrateur ; grandeur : niveau équivalent sur 8 h."],[6,1,0,"85 dB(A) = alerte, 90 dB(A) = danger ; impulsionnels : crête en dB(C)","Ici 92–95 dB(A) : au-dessus de la cote de danger."],[6,1,0,"Règle des 3 dB : +3 dB = énergie × 2 → durée admissible ÷ 2","88 dB(A) pour 4 h, 91 dB(A) pour 2 h."],[7,1,0,"Patient : poste calme, audiogramme de contrôle, CMI, déclaration CNAS, ORL, information","1. Poste calme. 2. Audiogramme de contrôle. 3. CMI ; déclaration CNAS sous 15 j à 3 mois. 4. Informer : irréversible, éviter loisirs bruyants, solvants et CO. 5. ORL et suivi."],[7,1,0,"Entreprise : mesure, réduction à la source, encoffrement, rotation, PICB en complément, visite semestrielle","1. Mesurer le bruit. 2. Réduire à la source. 3. Limiter la propagation (encoffrement, écrans). 4. Rotation, temps réduit. 5. PICB en complément. 6. Visite semestrielle des exposés."]]},{"id":"08","titre":"Menuisier et surdité","court":"Menuisier","theme":"Bruit","imgs":["a8"],"enonce":["Monsieur A., 51 ans, menuisier en atelier de fabrication de meubles depuis 35 ans : conception, taille, façonnage, polissage et assemblage de pièces en bois. Il utilise régulièrement des machines bruyantes et porte des protecteurs auditifs de façon irrégulière.","Pas d'antécédent ORL ou familial, pas de médicament ototoxique. Depuis 3 ans, baisse progressive de l'audition, avec des acouphènes récents.","Un audiogramme montre un déficit bilatéral prédominant sur les aigus. Après un arrêt d'exposition d'un mois, un nouvel audiogramme montre un aspect similaire."],"questions":["Lisez l'audiogramme : que représentent les deux tracés ? Seuils de chaque oreille à 500, 1000, 2000 et 4000 Hz ; forme, symétrie, comportement à 8000 Hz.","Quel type d'atteinte évoquez-vous ? Arguments (histoire, profession, audiométrie), puis stade.","Pourquoi un nouvel audiogramme après l'arrêt d'exposition ? Que signifie « similaire » ? Caractéristiques évolutives de la surdité professionnelle ?","Quels éléments écartent déjà d'autres causes ? Que devez-vous encore rechercher ?","Calculez le DA réglementaire de chaque oreille (TMP 42), précisez la meilleure oreille et concluez.","Est-elle indemnisable ? Tableau, critères, DPC, durée d'exposition, type de liste ; vérifiez chaque condition.","Que doit contenir le certificat ? Qui déclare, à qui, dans quel délai ?","Il porte ses protecteurs de façon irrégulière : conduite à tenir pour lui et mesures pour l'entreprise."],"grille":[[1,1,0,"Noir = CA ; rouge = CO (s'arrête à 4000 Hz) ; superposées","CA tracée jusqu'à 8000 Hz ; CO jusqu'à 4000 Hz ; pas d'écart air-os."],[1,2,0,"Seuils OD 20 / 20 / 65 / 70 ; OG 20 / 25 / 50 / 70 (± 5 dB)","Lecture tolérée à ± 5 dB."],[1,1,0,"Chute dès 2000 Hz, maximum à 4000, remontée à 8000 : encoche ; symétrique","Graves et médiums peu atteints, chute à partir de 2000 Hz, maximum à 4000 Hz, remontée à 8000 Hz (scotome) ; bilatérale quasi symétrique."],[2,2,1,"Surdité de perception bilatérale cochléaire due au bruit","Pas de composante de transmission (CA = CO), encoche à 4 kHz typique du bruit."],[2,1,0,"Arguments : 35 ans de machines, protection irrégulière, CA = CO, pas d'ATCD","35 ans de machines bruyantes, protection irrégulière ; baisse progressive depuis 3 ans, acouphènes récents ; CA et CO superposées ; pas d'ATCD ORL, familial ou ototoxique."],[2,1,0,"2e stade : l'encoche s'étend vers 2000 Hz, graves préservés","Encoche étendue vers 2000 Hz, graves encore préservés, gêne débutante avec acouphènes."],[3,1,0,"2e audiogramme : élimine une fatigue auditive (temporaire)","Distinguer un déficit temporaire qui récupère au repos d'une surdité permanente."],[3,1,0,"« Similaire » = irréversible ; bilatérale, symétrique, lente, ne s'aggrave plus après l'arrêt","Pas de récupération après 1 mois : déficit irréversible, atteinte cochléaire définitive ; installation lente et progressive."],[4,1,0,"Écartés : transmission, héréditaire, ototoxiques ; rechercher traumatisme, HTA, diabète, CO, solvants, loisirs, presbyacousie","Déjà écartés : otospongiose, surdité héréditaire, ototoxicité, transmission. À rechercher : traumatisme crânien ou auriculaire, HTA, diabète, CO, solvants (colles, vernis), loisirs bruyants, presbyacousie (51 ans)."],[5,2,1,"DA OD = 38,5 dB ; DA OG = 36 dB","OD = (2×20 + 4×20 + 3×65 + 70)/10 = 385/10. OG = (2×20 + 4×25 + 3×50 + 70)/10 = 360/10."],[5,1,0,"Meilleure oreille = gauche, 36 dB > 35 → rempli de justesse","36 dB, donc au moins 35 dB : critère de déficit rempli, de justesse."],[6,2,1,"TMP 42 : DPC 1 an, durée ≥ 1 an (35 ans), liste limitative ; audiogramme à 1 mois dans la fenêtre","Déficit bilatéral de perception cochléaire d'au moins 35 dB (36), irréversible ; confirmé 3 semaines à 1 an après l'arrêt (ici 1 mois) ; DPC 1 an ; durée d'au moins 1 an (35 ans) ; liste limitative : la menuiserie doit y figurer."],[7,1,0,"Certificat : identité, employeur, poste, travaux exposants, DA (D) = 38,5 et DA (G) = 36 dB","Identité, employeur, poste ; travaux exposants (taille, façonnage, polissage avec machines bruyantes) ; constat « surdité professionnelle de perception bilatérale avec DA (D) = 38,5 dB et DA (G) = 36 dB » ; arrêt éventuel."],[7,1,0,"Le patient déclare à la CNAS, 15 j – 3 mois","Qui : le patient. À qui : la CNAS. Délai : 15 jours à 3 mois."],[8,1,0,"Lui : port permanent des PICB, information, suivi audiométrique","Expliquer l'irréversibilité, exiger le port permanent des PICB, audiogramme de suivi."],[8,1,0,"Entreprise : réduction à la source, encoffrement, rotation, visite semestrielle","Mesurer le bruit, réduire à la source, encoffrement, écrans, rotation, PICB en complément, visite semestrielle des exposés."]]}];

<script>
(function(){
const $app = document.getElementById('app');
let zoomK=null, DA=null;
const A = {
  view:'home', // home | create | join | pick | station | result | da
  mode:null,   // 'solo' | 'exam' | 'cand'
  room:null, roomOK:null, code:'', peers:[],
  st:0, dur:240, phase:'lobby', epoch:0, endAt:0, rem:240000, checks:[], tab:'cand',
  ex:null, exRecv:0, beeped:{}, swapSeen:{}, msg:''
};
const LS = { get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
A.dur = LS.get('ecos_dur',240);
const hist = LS.get('ecos_hist',{});

const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => { const s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const S = () => STATIONS[A.st];
const totalPts = st => st.grille.reduce((a,g)=>a+g[1],0);
function scoreOf(st, checks){ let p=0; st.grille.forEach((g,i)=>{ if(checks[i]) p+=g[1]; }); return Math.round(p/totalPts(st)*200)/10; }

/* ---------- audio ---------- */
let AC=null;
function unlock(){ try{ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state==='suspended') AC.resume(); }catch(e){} }
function beep(n=1, f=880, len=.18, vib=true){ try{ unlock(); if(!AC) return; for(let i=0;i<n;i++){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=f; o.type='sine'; const t=AC.currentTime+i*(len+.12); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+len); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+len+.05);} }catch(e){} if(vib) try{navigator.vibrate && navigator.vibrate(n>1?[300,120,300,120,500]:200)}catch(e){} }
let wake=null; async function keepAwake(on){ try{ if(on && !wake && navigator.wakeLock){ wake=await navigator.wakeLock.request('screen'); } if(!on && wake){ await wake.release(); wake=null; } }catch(e){} }

/* ---------- room ---------- */
const QS=new URLSearchParams(location.search);
const BROKERS = QS.get('broker') ? [QS.get('broker')] : ['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const BASE='ecos-ste-laghouat/v1/';
const MYID=Math.random().toString(36).slice(2,10);
function mqttJoin(name){
  return new Promise((resolve,reject)=>{
    let bi=0, done=false;
    const topicP=BASE+name+'/p/';
    const tryNext=()=>{
      if(bi>=BROKERS.length){ if(!done){done=true; reject({code:'réseau'});} return; }
      const url=BROKERS[bi++];
      const cl=mqtt.connect(url,{clientId:'ecos_'+MYID+'_'+bi+'_'+Math.random().toString(36).slice(2,7), connectTimeout:6000, reconnectPeriod:2000, clean:true,
        will:{topic:topicP+MYID, payload:'', retain:true, qos:1}});
      let opened=false;
      const t=setTimeout(()=>{ if(!opened){ cl.end(true); tryNext(); } },7000);
      cl.on('connect',()=>{
        cl.subscribe(topicP+'+',{qos:1});
        if(opened){ cl.publish(topicP+MYID, JSON.stringify(pres), {retain:true,qos:1}); return; }
        opened=true; clearTimeout(t); if(done) return; done=true; resolve(mk(cl));
      });
      cl.on('error',()=>{ if(!opened){ clearTimeout(t); cl.end(true); tryNext(); } });
    };
    let pres={}; const peers={}; let hs=[]; let raf=0;
    const snapshot=()=>{ const me={peer:MYID,isMe:true,presence:{...pres}}; return [me,...Object.entries(peers).map(([id,p])=>({peer:id,isMe:false,presence:p}))]; };
    const emitP=()=>{ if(raf) return; raf=setTimeout(()=>{ raf=0; const arr=snapshot(); hs.forEach(h=>{try{h({peers:arr})}catch(e){}}); },30); };
    function mk(cl){
      cl.on('message',(topic,msg)=>{ const id=topic.slice(topicP.length); if(id===MYID) return; const txt=msg.toString(); if(!txt){ delete peers[id]; } else { try{ const np=JSON.parse(txt); const op=peers[id]; if(!(op && op.ts && np.ts && np.ts<op.ts)) peers[id]=np; }catch(e){} } emitP(); });
      let pubT=0;
      return {
        name,
        presence:async patch=>{ for(const k in patch){ if(patch[k]===null) delete pres[k]; else pres[k]=patch[k]; } emitP(); cl.publish(topicP+MYID, JSON.stringify(pres), {retain:true,qos:1}); },
        onPeers:h=>{ hs.push(h); emitP(); return ()=>{ hs=hs.filter(x=>x!==h); }; },
        peers:snapshot, connected:()=>cl.connected,
        leave:async()=>{ try{ cl.publish(topicP+MYID,'',{retain:true,qos:1}); }catch(e){} setTimeout(()=>cl.end(true),300); }
      };
    }
    tryNext();
  });
}
let roomApi = (typeof mqtt!=='undefined') ? {join:mqttJoin} : null;
A.roomOK = !!roomApi;

function genCode(){ const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
async function enterRoom(code, role){
  if(A.joining) return;            // a second tap while connecting must not open a second connection
  A.joining=true; A.msg='Connexion…'; render();
  try{
    if(A.room){ try{ await A.room.leave(); }catch(e){} A.room=null; }
    const r = await roomApi.join('ecos-'+code.toLowerCase());
    A.room=r; A.code=code; A.mode=role; A.joinedAt=Date.now();
    r.onPeers(ch=>{ A.peers = ch.peers; onPeersChange(); });
    if(role==='exam'){ A.phase='lobby'; A.epoch=0; pushState(); A.view='pick'; }
    else { await r.presence({role:'cand', swap:A.mySwap||null}); A.view='station'; }
    A.msg=''; A.joining=false; render();
  }catch(e){ A.joining=false; A.msg = 'Connexion impossible ('+(e&&e.code||'erreur')+'). Réessayez, ou utilisez le mode un seul téléphone.'; render(); }
}
function others(){ return (A.peers||[]).filter(p=>!p.isMe); }
function examPeer(){ let best=null; for(const p of others()){ if(p.presence && p.presence.role==='exam' && (!best || (p.presence.ts||0)>(best.presence.ts||0))) best=p; } return best; }
function candPeer(){ return others().find(p=>p.presence && p.presence.role==='cand'); }

function pushState(){
  if(!A.room || A.mode!=='exam') return;
  const rem = A.phase==='run' ? Math.max(0,A.endAt-Date.now()) : A.rem;
  A.room.presence({role:'exam', ts:Date.now(), st:A.st, phase:A.phase, epoch:A.epoch, rem:Math.round(rem), dur:A.dur, checks:A.checks.map(x=>x?1:0).join(''), swap:A.mySwap||null}).catch(()=>{});
}

function onPeersChange(){
  // tokens already present just after joining are history, not a request
  if(Date.now()-A.joinedAt<2500){ for(const p of others()){ const t=p.presence&&p.presence.swap; if(t) A.swapSeen[t]=1; } }
  for(const p of others()){
    const t = p.presence && p.presence.swap;
    if(t && !A.swapSeen[t] && t!==A.mySwap){ A.swapSeen[t]=1; flipRole(false); return; }
  }
  if(A.mode==='cand'){
    const e = examPeer();
    const prev = A.ex;
    if(e){
      A.exLost=0;
      if(prev && e.presence.ts && prev.ts && e.presence.ts<prev.ts){ updateStatus(); return; }  // older message: ignore
      if(e.presence!==A.exObj){ A.exObj=e.presence; A.ex = e.presence; A.exRecv = Date.now(); } else { updateStatus(); return; }
      const changed = !prev || prev.phase!==A.ex.phase || prev.st!==A.ex.st || prev.epoch!==A.ex.epoch || ((A.ex.phase==='result'||A.ex.phase==='over') && prev.checks!==A.ex.checks);
      if(changed){
        if(!prev || prev.epoch!==A.ex.epoch) A.beeped={};
        if(A.ex.phase==='run' && prev && prev.phase==='over'){ A.beeped.end=0; }
        if(A.ex.phase==='over' && prev && prev.phase==='run' && !A.beeped.end){ A.beeped.end=1; beep(3,660,.35); }
        if(A.ex.phase==='result'||A.ex.phase==='over'){ A.st=A.ex.st; A.checks=[...(A.ex.checks||'')].map(c=>c==='1'); if(A.ex.phase==='result') saveHist(); }
        render(); return;
      }
    } else if(prev){ if(!A.exLost) A.exLost=Date.now(); }
  }
  updateStatus();
}
function updateStatus(){
  const el=document.getElementById('peerstat'); if(!el) return;
  el.outerHTML = statusHTML();
}
function statusHTML(){
  if(!A.room) return '';
  if(A.mode==='exam'){ const c=candPeer(); return `<span id="peerstat" class="status ${c?'ok':'wait'}"><i></i><span class="stt">${c?'Candidat connecté':'Attente candidat'} · </span>${esc(A.code)}</span>`; }
  const e=examPeer(); return `<span id="peerstat" class="status ${e?'ok':'wait'}"><i></i><span class="stt">${e?'Examinateur connecté':'Attente examinateur'} · </span>${esc(A.code)}</span>`;
}
async function flipRole(initiator){
  recClear();
  if(initiator){ A.mySwap = Math.random().toString(36).slice(2,9); A.swapSeen[A.mySwap]=1; }
  if(A.mode==='exam'){ A.mode='cand'; A.ex=null; A.beeped={}; A.view='station'; if(A.room) await A.room.presence({role:'cand', st:null, phase:null, epoch:null, rem:null, dur:null, checks:null, swap:A.mySwap||null}).catch(()=>{}); }
  else { A.mode='exam'; A.phase='lobby'; A.epoch=(A.ex&&A.ex.epoch||0)+1; A.checks=[]; A.view='pick'; pushState(); }
  render();
}

/* ---------- timer ---------- */
function curRem(){
  if(A.mode==='cand'){ if(!A.ex) return A.dur*1000; const r=A.ex.rem||0; return A.ex.phase==='run' ? Math.max(0, r-(Date.now()-A.exRecv)) : (A.ex.phase==='over'||A.ex.phase==='result'?0:r); }
  return A.phase==='run' ? Math.max(0,A.endAt-Date.now()) : A.rem;
}
function curDur(){ return (A.mode==='cand' && A.ex ? A.ex.dur : A.dur)*1000; }
function curPhase(){ return A.mode==='cand' ? (A.ex?A.ex.phase:'none') : A.phase; }
let lastPush=0;
setInterval(()=>{
  if(A.mode==='cand' && A.exLost && Date.now()-A.exLost>10000 && !examPeer()){ A.exLost=0; A.ex=null; A.exObj=null; render(); }
  const ph=curPhase(), rem=curRem();
  const c=document.getElementById('clock');
  if(c){ c.textContent=fmt(rem); c.className='clock'+(ph==='over'||rem<=0&&ph==='run'?' over':rem<=60000&&(ph==='run'||ph==='pause')?' lowt':''); }
  const p=document.getElementById('prog'); if(p){ const d=curDur(); p.firstElementChild.style.width=Math.max(0,Math.min(100,100-rem/d*100))+'%'; p.className='prog'+(rem<=60000?' lowt':''); }
  if(ph==='run'){
    if(rem<=60000 && rem>20000 && !A.beeped.min){ A.beeped.min=1; beep(1,880,.2); }
    { const sec=Math.ceil(rem/1000); if(sec>0 && sec<=20 && A.lastTick!==sec){ A.lastTick=sec; if(sec===20) beep(2,1046,.16); else beep(1, sec<=5?988:740, sec<=5?.12:.06, false); } }
    if(rem<=0 && A.mode!=='cand'){ A.phase='over'; A.rem=0; recStop(); if(A.mode==='solo'){ A.tab='grid'; window.scrollTo(0,0); } if(!A.beeped.end){A.beeped.end=1; beep(3,660,.35);} pushState(); keepAwake(false); render(); }
    if(A.mode==='exam' && Date.now()-lastPush>1000){ lastPush=Date.now(); pushState(); }
  }
},250);


/* ---------- voice recording (solo mode, kept in memory only) ---------- */
A.recOn = LS.get('ecos_rec', false); A.recs=[]; let REC=null;
function recSupported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function recMime(){ for(const m of ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg']){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} } return ''; }
async function recStart(){
  if(!((A.mode==='solo'||A.mode==='exam') && A.recOn && recSupported())) return;
  if(REC && REC.mr && REC.mr.state==='paused'){ REC.mr.resume(); return; }
  if(REC) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=recMime(); const mr = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
    REC={stream, mr, chunks:[]};
    mr.ondataavailable=e=>{ if(e.data && e.data.size) REC && REC.chunks.push(e.data); };
    mr.onstop=()=>{ const r=REC; if(!r) return; const blob=new Blob(r.chunks,{type:mr.mimeType||'audio/webm'}); r.stream.getTracks().forEach(t=>t.stop()); REC=null;
      if(blob.size){ const url=URL.createObjectURL(blob); const el=document.createElement('audio'); el.controls=true; el.preload='metadata'; el.src=url; A.recs.push({url,el}); } render(); };
    mr.start(1000);
    if(A.phase==='pause') mr.pause();
    render();
  }catch(e){ A.recOn=false; LS.set('ecos_rec',false); A.tip='Micro refusé ou indisponible : l’enregistrement est désactivé.'; render(); setTimeout(()=>{A.tip='';render();},6000); }
}
function recPause(){ try{ if(REC && REC.mr.state==='recording') REC.mr.pause(); }catch(e){} }
function recStop(){ try{ if(REC && REC.mr.state!=='inactive') REC.mr.stop(); }catch(e){} }
function recClear(){ if(REC){ const r=REC; REC=null; try{ r.mr.onstop=null; if(r.mr.state!=='inactive') r.mr.stop(); }catch(e){} r.stream.getTracks().forEach(t=>t.stop()); }
  A.recs.forEach(r=>{ try{ r.el.pause(); URL.revokeObjectURL(r.url); }catch(e){} }); A.recs=[]; }
function recLive(){ return REC && REC.mr && REC.mr.state==='recording'; }
function recCard(){
  if(A.mode!=='solo' && A.mode!=='exam') return '';
  if(recLive()) return `<div class="card recc"><b><span class="recdot"></span> Enregistrement en cours…</b></div>`;
  if(!A.recs.length) return '';
  return `<div class="card recc"><div class="row" style="justify-content:space-between"><b>🎧 Réécouter ma réponse</b><button class="btn sm" data-a="recdel">🗑 Supprimer</button></div>${A.recs.map((r,i)=>`<div class="recslot" data-i="${i}">${A.recs.length>1?`<span class="muted" style="font-size:.8rem">Partie ${i+1}</span>`:''}</div>`).join('')}<div class="muted" style="font-size:.78rem;margin-top:6px">Gardé seulement sur ce téléphone, effacé automatiquement au changement de station.</div></div>`;
}
window.addEventListener('pagehide',()=>recClear());

function startStation(i){ recClear(); A.showSt=false; A.st=i; A.phase='brief'; A.epoch++; A.checks=S().grille.map(()=>false); A.rem=A.dur*1000; A.beeped={}; A.tab='cand'; A.view='station'; pushState(); render(); window.scrollTo(0,0); }
function go(){ unlock(); A.endAt=Date.now()+A.rem; A.phase='run'; keepAwake(true); pushState(); render(); recStart(); }
function pause(){ A.rem=Math.max(0,A.endAt-Date.now()); A.phase='pause'; recPause(); pushState(); render(); }
function finish(){ A.showSt=false; recStop(); if(A.mode==='candoff'){ A.phase='result'; keepAwake(false); A.view='corr'; render(); window.scrollTo(0,0); return; } if(A.phase==='run'){A.rem=Math.max(0,A.endAt-Date.now());} A.phase='result'; keepAwake(false); saveHist(); pushState(); A.view='result'; render(); window.scrollTo(0,0); }
function saveHist(){ const st=S(); const sc=scoreOf(st,A.checks); hist[st.id]={last:sc,best:Math.max(sc,(hist[st.id]&&hist[st.id].best)||0)}; LS.set('ecos_hist',hist); }

}

/* DA exercise */
function newDA(){ const r=(a,b)=>a+5*Math.floor(Math.random()*((b-a)/5+1)); const ear=()=>{const v=[r(10,30),r(15,45),r(30,65),r(50,85)];v[1]=Math.max(v[1],v[0]);v[2]=Math.max(v[2],v[1]);return v;}; DA={od:ear(),og:ear(),done:false,ans:{}}; }
const daOf = v => (2*v[0]+4*v[1]+3*v[2]+v[3])/10;
function vDA(){
  if(!DA) newDA();
  const fr=['500','1000','2000','4000'];
  const tab=`<table class="au"><tr><th>Oreille</th>${fr.map(f=>`<th>${f} Hz</th>`).join('')}</tr><tr><th>Droite</th>${DA.od.map(x=>`<td>${x}</td>`).join('')}</tr><tr><th>Gauche</th>${DA.og.map(x=>`<td>${x}</td>`).join('')}</tr></table>`;
  let res='';
  if(DA.done){
    const d=daOf(DA.od), g=daOf(DA.og), best=Math.min(d,g), bestE=d<=g?'droite':'gauche';
    const okD=Math.abs((DA.ans.d||-99)-d)<=0.25, okG=Math.abs((DA.ans.g||-99)-g)<=0.25;
    const fmtd=x=>String(x).replace('.',',');
    res=`<div class="card col" style="gap:8px">
      <div class="res-item ${okD?'ok':'ko'}"><span class="s">${okD?'✓':'✗'}</span><span><b>OD = ${fmtd(d)} dB</b><span class="ex">(2×${DA.od[0]} + 4×${DA.od[1]} + 3×${DA.od[2]} + ${DA.od[3]}) / 10 = ${2*DA.od[0]+4*DA.od[1]+3*DA.od[2]+DA.od[3]} / 10</span></span></div>
      <div class="res-item ${okG?'ok':'ko'}"><span class="s">${okG?'✓':'✗'}</span><span><b>OG = ${fmtd(g)} dB</b><span class="ex">(2×${DA.og[0]} + 4×${DA.og[1]} + 3×${DA.og[2]} + ${DA.og[3]}) / 10 = ${2*DA.og[0]+4*DA.og[1]+3*DA.og[2]+DA.og[3]} / 10</span></span></div>
      <div class="note ${best>=35?'info':''}"><b>Meilleure oreille : ${bestE}, ${fmtd(best)} dB → ${best>=35?'critère TMP 42 rempli (au moins 35 dB)':'critère non rempli (moins de 35 dB)'}</b></div>
    </div>`;
  }
  return `${topbar(homeBtn())}
  <div class="col">
    <h2>Exercice : calcul du DA</h2>
    <div class="note info">DA = [ 2 × 500 + 4 × 1000 + 3 × 2000 + 1 × 4000 ] / 10 · la reconnaissance se juge sur la <b>meilleure</b> oreille (au moins 35 dB).</div>
    <div class="card">${tab}</div>
    <div class="card row" style="gap:20px">
      <label class="row">DA OD <input class="da-in" id="dad" inputmode="decimal" value="${DA.ans.d??''}"> dB</label>
      <label class="row">DA OG <input class="da-in" id="dag" inputmode="decimal" value="${DA.ans.g??''}"> dB</label>
      <button class="btn pri" data-a="daCheck">Vérifier</button>
      <button class="btn" data-a="daNew">Nouvel audiogramme</button>
    </div>
    ${res}
  </div>`;
}

function render(){
  let h='';
  switch(A.view){
    case 'home': h=vHome(); break;
    case 'create': h=vCreate(); break;
    case 'join': h=vJoin(); break;
    case 'pick': h=vPick(); break;
    case 'station': h = A.mode==='cand' ? vStationCand() : vStationExam(); break;
    case 'result': h = (A.mode==='cand' && A.ex && A.ex.phase!=='result' && A.ex.phase!=='over') ? vStationCand() : vResult(); break;
    case 'da': h=vDA(); break;
    case 'off': h=vOff(); break;
    case 'corr': h=vCorr(); break;
  }
  if(A.mode==='cand' && A.view==='result' && A.ex && A.ex.phase!=='result' && A.ex.phase!=='over') A.view='station';
  const sheet = (A.showSt && A.view==='station' && A.mode==='exam') ? `<div class="sheet"><div class="sheet-in"><div class="sheet-top"><b>Station ${S().id} · énoncé du candidat</b><button class="btn sm" data-a="hidest">✕ Fermer</button></div>${stationText(S())}</div></div>` : '';
  document.body.style.overflow = sheet ? 'hidden' : '';
  $app.innerHTML = `<div class="wrap">${h}</div>` + sheet + (zoomK?`<div class="zoom" data-a="unzoom"><img src="${IMG[zoomK]}" alt="Agrandissement"></div>`:'');
  document.querySelectorAll('.recslot').forEach(sl=>{ const r=A.recs[+sl.dataset.i]; if(r) sl.appendChild(r.el); });
  const ci=document.getElementById('codein'); if(ci){ ci.focus(); ci.addEventListener('keydown',e=>{ if(e.key==='Enter') act('joinGo'); }); }
}

async function act(a, v, el){
  unlock();
  switch(a){
    case 'rectog': A.recOn=!A.recOn; LS.set('ecos_rec',A.recOn); if(A.recOn){ try{ const st=await navigator.mediaDevices.getUserMedia({audio:true}); st.getTracks().forEach(t=>t.stop()); }catch(e){ A.recOn=false; LS.set('ecos_rec',false); A.tip='Micro refusé ou indisponible.'; } } break;
    case 'recdel': recClear(); break;
    case 'home': recClear(); if(A.room){ try{await A.room.leave();}catch(e){} A.room=null; } keepAwake(false); Object.assign(A,{view:'home',mode:null,phase:'lobby',ex:null,msg:''}); break;
    case 'create': A.code=genCode(); A.msg=''; A.view='create'; break;
    case 'createGo': await enterRoom(A.code,'exam'); return;
    case 'join': A.code=''; A.msg=''; A.view='join'; break;
    case 'joinGo': { const c=(document.getElementById('codein').value||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(c.length!==4){ A.code=c; A.msg='Le code contient 4 caractères.'; break; } A.code=c; await enterRoom(c,'cand'); return; }
    case 'solo': A.mode='solo'; A.view='pick'; break;
    case 'theme': { const t=isDark()?'light':'dark'; document.documentElement.dataset.theme=t; LS.set('ecos_theme',t); break; }
    case 'fs': await toggleFS(); return;
    case 'off': A.view='off'; break;
    case 'offrole': A.mode=v; A.view='pick'; break;
    case 'dur': A.dur=+v; LS.set('ecos_dur',A.dur); break;
    case 'pick': startStation(+v); return;
    case 'random': { let i; do{ i=Math.floor(Math.random()*STATIONS.length);}while(STATIONS.length>1&&i===A.st&&A.epoch); startStation(i); return; }
    case 'go': if(A.phase==='brief') A.recOn=false; go(); return;
    case 'gorec': A.recOn=true; go(); return;
    case 'regrade': A.phase='over'; A.tab='grid'; A.view='station'; pushState(); window.scrollTo(0,0); break;
    case 'solofin': if(A.phase==='run') A.rem=Math.max(0,A.endAt-Date.now()); A.phase='over'; recStop(); keepAwake(false); A.tab='grid'; window.scrollTo(0,0); break;
    case 'pause': pause(); return;
    case 'finish': finish(); return;
    case 'chk': { const i=+v; A.checks[i]=!A.checks[i]; pushState(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
    case 'tab': A.tab=v; window.scrollTo(0,0); break;
    case 'next': startStation((A.st+1)%STATIONS.length); return;
    case 'backpick': A.phase='lobby'; pushState(); A.view='pick'; break;
    case 'retry': startStation(A.st); return;
    case 'swap': await flipRole(true); return;
    case 'zoom': zoomK=v; break;
    case 'showst': A.showSt=true; break;
    case 'hidest': A.showSt=false; break;
    case 'plus': {
      if(A.phase==='run') A.endAt+=20000;
      else if(A.phase==='pause'||A.phase==='brief') A.rem+=20000;
      else if(A.phase==='over'){ A.rem=20000; A.endAt=Date.now()+20000; A.phase='run'; A.beeped.end=0; keepAwake(true); recStart(); }
      A.lastTick=null; pushState(); { const y=window.scrollY; render(); window.scrollTo(0,y); } return; }
    case 'unzoom': zoomK=null; break;
    case 'da': A.view='da'; DA=null; break;
    case 'daNew': newDA(); break;
    case 'daCheck': { const p=id=>parseFloat((document.getElementById(id).value||'').replace(',','.')); DA.ans={d:p('dad'),g:p('dag')}; if(isNaN(DA.ans.d))DA.ans.d=null; if(isNaN(DA.ans.g))DA.ans.g=null; DA.done=true; break; }
  }
  render();
}
{ const sc=(QS.get('salle')||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(sc.length===4 && roomApi){ A.code=sc; A.view='join'; setTimeout(()=>act('joinGo'),50); } }
document.addEventListener('pointerdown', unlock, {passive:true});
document.addEventListener('click', e=>{ const el=e.target.closest('[data-a]'); if(!el || el.disabled) return; act(el.dataset.a, el.dataset.v, el); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && zoomK){ zoomK=null; render(); } });
render();
})();
</script>
</body></html>
